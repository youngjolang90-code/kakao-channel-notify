name: 채널 새 글 알림

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal=평소 / observe=글 목록만 확인 / test=최신 글 강제 전송"
        type: choice
        options: [normal, observe, test]
        default: normal

permissions:
  contents: write

concurrency:
  group: channel-notify
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 새 글 확인 및 알림
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: python notify.py --mode "$MODE"

      - name: 새 리프레시 토큰 저장
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f new_refresh_token.txt ]; then
            gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < new_refresh_token.txt
            rm -f new_refresh_token.txt
            echo "리프레시 토큰 시크릿 갱신 완료"
          fi

      - name: 상태 저장
        if: always()
        run: |
          git config user.name "channel-notify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "state: $(date -u +%FT%TZ)" && git push
          fi
